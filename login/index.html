<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - Ollas y Peroles</title>
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="contenedor-principal">
        <div class="tarjeta-login">
            <div class="encabezado-login">
                <i class="fa-solid fa-user-shield icono-login"></i>
                <h2>Iniciar Sesión</h2>
                <p>Sistema de Gestión "Ollas y Peroles"</p>
            </div>

            <form id="formLogin">
                <div class="grupo-input">
                    <label>Usuario</label>
                    <div class="input-con-icono">
                        <i class="fa-solid fa-user"></i>
                        <input type="text" id="usuario" placeholder="Ej. admin" required>
                    </div>
                </div>

                <div class="grupo-input">
                    <label>Contraseña</label>
                    <div class="input-con-icono">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="password" placeholder="••••••" required>
                    </div>
                </div>

                <div id="mensajeError" class="mensaje-error" style="color: red; margin-top: 10px;"></div>

                <button type="submit" class="boton-ingresar">INGRESAR</button>
            </form>
        </div>
    </div>
    <script src="login.js"></script>
</body>
</html>
