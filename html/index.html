<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedidos - Ollas y Peroles</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Open+Sans:wght@400;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/css/index.css">
</head>

<body>

    <section id="pantalla-login" class="pantalla-login">
        <div class="login-box">
            <h1>⚓ Ollas y Peroles</h1>
            <p>Sistema de Pedidos</p>
            <input type="text" id="input-codigo-mozo" placeholder="Ingresa tu Código (ej: 101)" autofocus>
            <button onclick="iniciarTurno()">INGRESAR AL SISTEMA</button>
        </div>
    </section>

    <section id="pantalla-pedidos" class="pantalla-pedidos oculto">
        <header class="top-bar">
            <div class="info-mozo">
                <i class="fa-solid fa-user-tie"></i> <span id="display-mozo">---</span>
            </div>
            <button class="btn-historial" onclick="verHistorialMozo()">
                <i class="fa-solid fa-clock-rotate-left"></i> Historial
            </button>
            <button class="btn-salir" onclick="cerrarSesion()">
                <i class="fa-solid fa-sign-out-alt"></i>
            </button>
        </header>

        <div class="contenido-principal">
            <div class="columna-menu">
                <div class="tabs-categorias">
                    <button class="tab active" onclick="cargarCategoria('comidas')">🥘 COMIDAS</button>
                    <button class="tab" onclick="cargarCategoria('extras')">🍟 EXTRAS</button>
                    <button class="tab" onclick="cargarCategoria('bebidas')">🍹 BEBIDAS</button>
                </div>
                <div id="grid-productos" class="grid-productos"></div>
            </div>

            <div class="columna-ticket">
                <div class="ticket-header">
                    <h3>Orden en Curso</h3>
                    <input type="text" id="input-mesa" placeholder="N° Mesa" class="input-mesa">
                </div>
                <div id="lista-pedido" class="lista-pedido">
                    <div class="mensaje-vacio">Selecciona productos...</div>
                </div>
                <div class="ticket-footer">
                    <div class="total-row">
                        <span>TOTAL:</span>
                        <span id="txt-total">S/. 0.00</span>
                    </div>
                    <button class="btn-enviar-cocina" onclick="enviarCocina()">
                        CONFIRMAR ORDEN <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </div>
            </div>
        </div>
    </section>

    <section id="pantalla-historial" class="pantalla-pedidos oculto" style="background: #f4f4f4;">
        <header class="top-bar" style="background: #333;">
            <button onclick="volverAPedidos()"
                style="background:none; border:none; color:white; font-size:1.2rem; cursor:pointer;">
                <i class="fa-solid fa-arrow-left"></i> Volver
            </button>
            <div style="font-weight:bold;">Mis Movimientos</div>
            <div></div>
        </header>

        <div style="padding: 20px; overflow-y: auto; height: 100%;">
            <h2 style="color:#333; margin-top:0;">📋 Últimos Pedidos</h2>
            <div id="lista-historial-mozo">
            </div>
        </div>
    </section>
    <div id="ticket-impresion" class="ticket-oculto">
    </div>

    <script src="js/app.js"></script>
</body>

</html>
<script src="/js/index.js"></script>
</body>

</html>
