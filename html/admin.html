<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Ollas y Peroles</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body>

    <div class="header">
        <div>
            <h1>📊 Panel Administrativo</h1>
            <p class="subtitulo">Sistema Ollas y Peroles</p>
        </div>
        <div class="filtros no-print">
            <button class="btn-filtro active" onclick="filtrar('hoy', this)">Hoy</button>
            <button class="btn-filtro" onclick="filtrar('semana', this)">Semana</button>
            <button class="btn-filtro" onclick="filtrar('mes', this)">Mes</button>
            <button class="btn-filtro" onclick="filtrar('anio', this)">Año</button>
        </div>
        <div class="botones-accion no-print">
            <button class="btn-imprimir" onclick="window.print()"><i class="fa-solid fa-print"></i></button>
            <button class="btn-refrescar" onclick="cargarReporte(); cargarListaMozos();"><i class="fa-solid fa-sync"></i></button>
        </div>
    </div>

    <div class="grid-stats">
        <div class="card-resumen">
            <div class="label">Ventas</div>
            <div id="total-dinero" class="big-number verde">S/. 0.00</div>
        </div>
        <div class="card-resumen">
            <div class="label">Pedidos</div>
            <div id="total-pedidos" class="big-number azul">0</div>
        </div>
        <div class="card-resumen">
            <div class="label">Promedio</div>
            <div id="ticket-promedio" class="big-number morado">S/. 0.00</div>
        </div>
    </div>

    <h3>🥘 Platos Estrella</h3>
    <div class="tabla-contenedor">
        <table>
            <thead><tr><th>Producto</th><th>Ventas</th><th>Total</th></tr></thead>
            <tbody id="tabla-productos"></tbody>
        </table>
    </div>

    <h3>🤵 Rendimiento Mozos</h3>
    <div class="tabla-contenedor">
        <table>
            <thead><tr><th>Mozo</th><th>Pedidos</th><th>Total</th></tr></thead>
            <tbody id="tabla-mozos"></tbody>
        </table>
    </div>

    <h3 style="margin-top: 40px; border-left-color: #e67e22;">👥 Gestión de Personal</h3>
    
    <div class="card-resumen" style="text-align: left; display: block; max-width: 600px; margin-bottom: 20px;">
        <h4 style="margin-top: 0;">Registrar Nuevo Mozo</h4>
        <div style="display: flex; gap: 10px;">
            <input type="text" id="nuevo-nombre" placeholder="Nombre" style="padding: 8px; flex: 1;">
            <input type="number" id="nuevo-codigo" placeholder="Código" style="padding: 8px; width: 100px;">
            <button onclick="crearMozo()" style="background: #27ae60; color: white; border: none; padding: 8px 15px; cursor: pointer; border-radius: 4px;">Guardar</button>
        </div>
        <p id="mensaje-mozo" style="margin: 5px 0 0 0; font-size: 0.9rem;"></p>
    </div>

    <div class="tabla-contenedor" style="max-width: 800px;">
        <table>
            <thead><tr><th>Código</th><th>Nombre</th><th>Estado</th><th>Acción</th></tr></thead>
            <tbody id="lista-mozos-db"></tbody>
        </table>
    </div>

    <script src="/js/admin.js"></script> 
</body>
</html>
